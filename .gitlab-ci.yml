dev_prm_nxt_sales-deploy:
    stage: deploy
    environment:
      name: development 
    # when: manual
    tags:
        - prm-nxt-sales-service-runner
    before_script:
        - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $PRM_NXT_SALES_ECR_REGISTRY
        - aws eks --region $AWS_DEFAULT_REGION update-kubeconfig --name $AWS_EKS_DEV_CLUSTER_NAME
    script:
        #Get nodes
        - kubectl get nodes
        - kubectl get po -n dev

        # Create temp env file from GitLab variables
        - |
            cat > gitlab-secrets.env <<EOF
            LOAD_STORYBOOK=$LOAD_STORYBOOK
            SECRET_KEY=$SECRET_KEY
            RAZORPAY_KEY=$RAZORPAY_KEY
            MOENGAGE_KEY=$MOENGAGE_KEY
            GQL_BASE_URL=$GQL_BASE_URL
            ENVIRONMENT=$ENVIRONMENT
            CDN_ASSETS_URL=$CDN_ASSETS_URL
            MIXPANEL_PROJECT_TOKEN=$MIXPANEL_PROJECT_TOKEN
            ENABLE_MOENGAGE_MIXPANEL_EVENTS=$ENABLE_MOENGAGE_MIXPANEL_EVENTS
            ENABLE_REGISTRATION_SCHEDULER=$ENABLE_REGISTRATION_SCHEDULER
            DASHBOARD_EXTERNAL_URL=$DASHBOARD_EXTERNAL_URL
            REDIRECT_AD_URL=$REDIRECT_AD_URL
            AD_URL=$AD_URL
            AZURE_TENANT_ID=$AZURE_TENANT_ID
            WEB_CLIENT_ID=$WEB_CLIENT_ID
            MOBILE_CLIENT_ID=$MOBILE_CLIENT_ID
            EOF

        # Create / update kubernetes secret from GitLab variable
        - kubectl create secret generic msales-secret -n dev --from-env-file=gitlab-secrets.env --dry-run=client -o yaml | kubectl apply -f - 

        #Fetch Image tag in variable
        - IMAGE_TAG=$(cat ecr_image_tag.txt)
        - echo "Deploying with image 891377194963.dkr.ecr.ap-south-1.amazonaws.com/prmnxt_dev_msales:$IMAGE_TAG"
        #Change Image tag in YAML
        - sed "s/{{IMAGE_TAG}}/${IMAGE_TAG}/g" $CI_PROJECT_DIR/deployment/dev/nginx-frontend-deployment.yaml > nginx_updated-frontend-deployment.yaml
        # destrying previous deplyment 
        - kubectl delete -f nginx_updated-frontend-deployment.yaml -n dev
        # creating new deployment 
        - kubectl apply -f nginx_updated-frontend-deployment.yaml -n dev
        - sleep 140
        - kubectl get po -n dev
        - kubectl get deployment -n dev
        - POD_ID=$(kubectl get po -n dev  -l app=nginx-frontend --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}')
        - kubectl get deployment -n dev
        # Check the pod status
        - POD_STATUS=$(kubectl get po $POD_ID -n dev -o jsonpath='{.status.phase}')
        - echo "Pod status is --> $POD_STATUS"
        # Check the container readiness status
        - CONTAINER_STATUS=$(kubectl get po $POD_ID -n dev -o jsonpath='{.status.containerStatuses[*].ready}')
        - echo "Container readiness status is --> $CONTAINER_STATUS"
        # Fail the stage if the pod is not running
        - |
            if [[ "$POD_STATUS" != "Running" || $(echo "$CONTAINER_STATUS" | grep -v "true") ]]; then 
                echo "Deployment failed:Pod is not running or not ready. Status:$POD_STATUS, Readiness:$CONTAINER_STATUS"; 
            exit 1; 
            fi
        - kubectl describe po $POD_ID -n dev
        - kubectl get deployment nginx-frontend -n dev -o jsonpath='{.spec.template.spec.containers[0].image}'
        - kubectl get po $POD_ID -n dev
        - rm -f gitlab-secrets.env
    artifacts:
        paths:
            - ecr_image_tag.txt
    rules:
        # not run on merge request
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   
          changes: 
            - "**/*"
          when: never
        # run only on develop branch
        - if: '$CI_COMMIT_BRANCH != "develop"'
          when: never   
        # run through web interface for develop branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop"'
          when: always
        #  run on develop branch on code changes detected
        - if: '$CI_COMMIT_BRANCH == "develop"'
        - changes:  
            - $CI_PROJECT_DIR/deployment/dev/Dockerfile
            - '**/*'
        - when: never

dev_prm_nxt_sales-rollback:
    stage: rollback 
    when: manual
    tags:
        - prm-nxt-sales-service-runner
    before_script:
        - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $PRM_NXT_SALES_ECR_REGISTRY
        - aws eks --region $AWS_DEFAULT_REGION update-kubeconfig --name $AWS_EKS_DEV_CLUSTER_NAME
    script:
        - if [ -n "$PRM_NXT_SALES_DEV_ROLLBACK_SPECIFIC_VERSION_IMG_TAG" ]; then
            echo "Rolling back to specific image version deployment ---> 891377194963.dkr.ecr.ap-south-1.amazonaws.com/prmnxt_dev_msales:$PRM_NXT_SALES_DEV_ROLLBACK_SPECIFIC_VERSION_IMG_TAG";
            kubectl set image deployment/nginx-frontend nginx-frontend=891377194963.dkr.ecr.ap-south-1.amazonaws.com/prmnxt_dev_msales:$PRM_NXT_SALES_DEV_ROLLBACK_SPECIFIC_VERSION_IMG_TAG -n dev || exit 1;
          else
            echo "No specific image version is specified for rollback, So Rolling back to the previous revision";
            previous_version=$(aws ecr describe-images --repository-name prmnxt_dev_msales --query "imageDetails[?imageTags[?contains(@, 'prmnxt_dev_msales')]].[imageTags[0], imagePushedAt]" --output text --region ap-south-1 | sort -k2,2r | awk 'NR==2 {print $1}');
            echo "Previous ECR image ---> 891377194963.dkr.ecr.ap-south-1.amazonaws.com/prmnxt_dev_msales:$previous_version";

            if kubectl get deployment nginx-frontend -n dev; then
                kubectl delete deployment nginx-frontend -n dev || exit 1;
                kubectl create deployment nginx-frontend --image=891377194963.dkr.ecr.ap-south-1.amazonaws.com/prmnxt_dev_msales:$previous_version -n dev || exit 1;
            else
                echo "Deployment nginx-frontend does not exist. Unable to rollback.";
                exit 1;
            fi  
          fi
        - sleep 140
        - kubectl get po -n dev
        - kubectl get deployment -n dev
        - POD_ID=$(kubectl get po -n dev  -l app=nginx-frontend --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}')
        - kubectl get deployment -n dev
        # Check the pod status
        - POD_STATUS=$(kubectl get po $POD_ID -n dev -o jsonpath='{.status.phase}')
        - echo "Pod status is --> $POD_STATUS"
        # Check the container readiness status
        - CONTAINER_STATUS=$(kubectl get po $POD_ID -n dev -o jsonpath='{.status.containerStatuses[*].ready}')
        - echo "Container readiness status is --> $CONTAINER_STATUS"
        # Fail the stage if the pod is not running
        - |
            if [[ "$POD_STATUS" != "Running" || $(echo "$CONTAINER_STATUS" | grep -v "true") ]]; then 
                echo "Deployment failed:Pod is not running or not ready. Status:$POD_STATUS, Readiness:$CONTAINER_STATUS"; 
            exit 1; 
            fi
        - kubectl describe po $POD_ID -n dev
        - kubectl get deployment nginx-frontend -n dev -o jsonpath='{.spec.template.spec.containers[0].image}'
        - kubectl get po $POD_ID -n dev
    rules:
        # not run on merge request
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   
          changes: 
            - "**/*"
          when: never
        # run only on develop branch
        - if: '$CI_COMMIT_BRANCH != "develop"'
          when: never   
        # run through web interface for develop branch 
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop"'
          when: manual
        #  run on develop branch on code changes detected
        - if: '$CI_COMMIT_BRANCH == "develop"'
        - changes:  
            - $CI_PROJECT_DIR/deployment/dev/Dockerfile
            - '**/*'
        - when: never

dev_prm_nxt_sales-restart_deployment:
    stage: restart-deployment
    when: manual
    tags:
        - prm-nxt-sales-service-runner
    before_script:
        - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $PRM_NXT_SALES_ECR_REGISTRY
        - aws eks --region $AWS_DEFAULT_REGION update-kubeconfig --name $AWS_EKS_DEV_CLUSTER_NAME
    script:
        - echo "Checking current status of the pods before deletion"
        - kubectl get po -n dev
        - kubectl get deployment -n dev
        # Get the ID of the existing pod
        - POD_ID=$(kubectl get po -n dev -l app=nginx-frontend --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}')
        - echo "Current POD_ID -> $POD_ID"
        # Check the pod status before deletion
        - POD_STATUS=$(kubectl get po $POD_ID -n dev -o jsonpath='{.status.phase}')
        - echo "Pod status before deletion is --> $POD_STATUS"
        # Delete the existing pod to free up IPs
        - echo "Deleting existing pod for nginx-frontend..."
        - kubectl delete pod $POD_ID -n dev
        - echo "Restarting Service Deployment"
        - echo "Waiting for the pods to be ready..."
        - sleep 60  # Initial sleep before checking the status
        - MAX_RETRIES=10 
        - RETRIES=0
        - SUCCESS=false
        - >
          while [ $RETRIES -lt $MAX_RETRIES ]; do
            # Get the new pod ID
            POD_ID=$(kubectl get po -n dev -l app=nginx-frontend --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}')
            echo "New POD_ID -> $POD_ID"
            status=$(kubectl get po $POD_ID -n dev -o jsonpath='{.status.phase}')
            echo "New pod status is --> $POD_STATUS"
            if [[ $status == "Running" ]]; then
              SUCCESS=true
              break
            else
              echo "New pod is not running yet. Current status -> $status. Retrying in 30 seconds..."
              sleep 30
            fi
            RETRIES=$((RETRIES+1))
            sleep 60  # Added sleep before checking the status again
          done
          # Added condition to check if rollout was successful and fail the job if not
        - >
          if [ "$SUCCESS" = true ]; then
            echo "Deployment successfully rolled out."
          else
            echo "Failed to recreate deployment after $MAX_RETRIES attempts. Exiting..."
            exit 1  # Fail the job
          fi
        - POD_ID=$(kubectl get po -n dev -l app=nginx-frontend --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}')
        - kubectl get po $POD_ID -n dev
        # Check the pod status
        - POD_STATUS=$(kubectl get po $POD_ID -n dev -o jsonpath='{.status.phase}')
        - echo "Pod status is --> $POD_STATUS"
        # Check the container readiness status
        - CONTAINER_STATUS=$(kubectl get po $POD_ID -n dev -o jsonpath='{.status.containerStatuses[*].ready}')
        - echo "Container readiness status is --> $CONTAINER_STATUS"
        # Fail the stage if the pod is not running
        - |
            if [[ "$POD_STATUS" != "Running" || $(echo "$CONTAINER_STATUS" | grep -v "true") ]]; then 
                echo "Deployment failed:Pod is not running or not ready. Status:$POD_STATUS, Readiness:$CONTAINER_STATUS"; 
            exit 1; 
            fi
        - kubectl describe po $POD_ID -n dev
        - kubectl get deployment nginx-frontend -n dev -o jsonpath='{.spec.template.spec.containers[0].image}'
        - kubectl get po $POD_ID -n dev
    rules:
        # not run on merge request
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   
          changes: 
            - "**/*"
          when: never
        # run only on develop branch
        - if: '$CI_COMMIT_BRANCH != "develop"'
          when: never   
        # run through web interface for develop branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop"'
          when: manual
        #  run on develop branch on code changes detected
        - if: '$CI_COMMIT_BRANCH == "develop"'
        - changes:  
            - $CI_PROJECT_DIR/deployment/dev/Dockerfile
            - '**/*'
        - when: never


