stages:
    - build
    - test
    - scan
    - fortify
    - docker
    - deploy 
    - rollback
    - restart-deployment

variables:
    DOCKER_DRIVER: overlay2

# --------------------------------------------------------------------------------------------
# ↓ development Stages ↓
# --------------------------------------------------------------------------------------------

dev_prm_nxt_sales-build:
    stage: build
    tags:
        - prm-nxt-sales-service-runner
    before_script:
        - npm config set proxy http://10.23.26.233:8080
        - npm config set https-proxy http://10.23.26.233:8080
        - npm config set strict-ssl false
        - echo "=== Checking Memory Usage ==="
        - free -m
        - echo "=== Checking Disk Space ==="
        - df -h
        - echo "=== Checking CPU Usage ==="
        - top -bn1 | head -n 10
        - echo "Checking npm version"
        - npm -v
        - pwd
        - echo "Yarn version"
        - yarn -v
    script:
        - echo "Installing dependencies..."
        - yarn install
        - echo "Building the application..."
        - yarn build:web:dev
    artifacts:
        paths:
            - build/
    rules:
        # not run on merge request
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          changes:
            - '**/*'
          when: never
        # Job will run for feature branch
        - if: '$CI_COMMIT_BRANCH =~ /^feature\/.*$/'
        # Job will run for bug fix branch
        - if: '$CI_COMMIT_BRANCH =~ /^bugfix\/.*$/'
        # Job will run for hot fix branch
        - if: '$CI_COMMIT_BRANCH =~ /^hotfix\/.*$/'
        # Job will run on manual pipeline run for feature branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH =~ /^feature\/.*$/'
        # Job will run on manual pipeline run for bug fix branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH =~ /^bugfix\/.*$/'
        # Job will run on manual pipeline run for hot fix branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH =~ /^hotfix\/.*$/'
        # run through web interface for develop branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop"'
        #  run on develop branch on code changes detected
        - if: '$CI_COMMIT_BRANCH == "develop"'
          changes:
            - $CI_PROJECT_DIR/deployment/dev/Dockerfile
            - '**/*'
        - if: '$CI_COMMIT_BRANCH != "develop"'
          when: never

dev_prm_nxt_sales-test:
    stage: test
    tags:
        - prm-nxt-sales-service-runner
    before_script:
        - npm config set proxy http://10.23.26.233:8080
        - npm config set https-proxy http://10.23.26.233:8080
        - npm config set strict-ssl false
    script:
        - echo "Running tests and generating coverage report..."
        - yarn install
        - yarn run test || EXIT_CODE=$?
        - echo "Jest exit code $EXIT_CODE" 
    artifacts:
        paths:
            - coverage/
    rules:
        # not run on merge request
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          changes:
            - '**/*'
          when: never
        # Job will run for feature branch
        - if: '$CI_COMMIT_BRANCH =~ /^feature\/.*$/'
        # Job will run for bug fix branch
        - if: '$CI_COMMIT_BRANCH =~ /^bugfix\/.*$/'
        # Job will run for hot fix branch
        - if: '$CI_COMMIT_BRANCH =~ /^hotfix\/.*$/'
        # Job will run on manual pipeline run for feature branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH =~ /^feature\/.*$/'
        # Job will run on manual pipeline run for bug fix branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH =~ /^bugfix\/.*$/'
        # Job will run on manual pipeline run for hot fix branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH =~ /^hotfix\/.*$/'
        # run through web interface for develop branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop"'
        #  run on develop branch on code changes detected
        - if: '$CI_COMMIT_BRANCH == "develop"'
          changes:
            - $CI_PROJECT_DIR/deployment/dev/Dockerfile
            - '**/*'
        - if: '$CI_COMMIT_BRANCH != "develop"'
          when: never

dev_prm_nxt_sales-sonarqube-scan:
    stage: scan
    tags:
        - runner
    image: 
        name: 128081702938.dkr.ecr.ap-south-1.amazonaws.com/revostry:sonar_scanner-v0.0.1
        entrypoint: [""]
    variables:
        SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  
        GIT_DEPTH: "0" 
    cache:
        key: "${CI_JOB_NAME}"
        paths:
            - .sonar/cache
    script: 
        - echo "Running sonar-scanner..."
        - sonar-scanner -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info || SCAN_EXIT_STATUS=$?
        - echo "Sonar-scanner exit status:${SCAN_EXIT_STATUS}"
        - echo "Generating CNES report..."
        - java -jar /revostry/sonar-report-jar/sonar-cnes-report-4.3.0.jar -s $SONAR_HOST_URL -t $SONAR_AUTH_TOKEN -p base_tataplay_org_prm-nxt_prm-nxt-sales_AZIy6mBb1r-taeCknfNW -f docx -o prm-nxt-sales-dev-sonarscan-report
        - REPORT_GENERATION_STATUS=$?
        - echo "CNES report generation exit status:${REPORT_GENERATION_STATUS}"
        - echo "Exiting with status:${SCAN_EXIT_STATUS}"
        - exit ${SCAN_EXIT_STATUS}
    artifacts:
        paths:
          - prm-nxt-sales-dev-sonarscan-report/*.docx
        when: always
    allow_failure: true
    rules:
        # not run on merge request
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          changes:
            - '**/*'
          when: never
        # Job will run for feature branch
        - if: '$CI_COMMIT_BRANCH =~ /^feature\/.*$/'
        # Job will run for bug fix branch
        - if: '$CI_COMMIT_BRANCH =~ /^bugfix\/.*$/'
        # Job will run for hot fix branch
        - if: '$CI_COMMIT_BRANCH =~ /^hotfix\/.*$/'
        # Job will run on manual pipeline run for feature branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH =~ /^feature\/.*$/'
        # Job will run on manual pipeline run for bug fix branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH =~ /^bugfix\/.*$/'
        # Job will run on manual pipeline run for hot fix branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH =~ /^hotfix\/.*$/'
        # run through web interface for develop branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop"'
        #  run on develop branch on code changes detected
        - if: '$CI_COMMIT_BRANCH == "develop"'
          changes:
            - $CI_PROJECT_DIR/deployment/dev/Dockerfile
            - '**/*'
        - if: '$CI_COMMIT_BRANCH != "develop"'
          when: never

