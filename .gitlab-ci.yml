dev_prm_nxt_sales-docker_build:
  stage: docker
  tags:
    - prm-nxt-sales-service-runner
  before_script:
    - mkdir -p nginx-front
    - cp -r build/* nginx-front/
    - ls nginx-front/ # Optional: to verify the files are there
    
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $PRM_NXT_SALES_ECR_REGISTRY
    - cp deployment/dev/nginx.conf . # Copy nginx.conf to the project root

  script:
    - echo "Checking for changes in Dockerfile and source files..."
    - |
      if [ -n "$(git diff --name-only HEAD~1 HEAD -- $CI_PROJECT_DIR/deployment/dev/Dockerfile)" ] || [ -n "$(git diff --name-only HEAD~1 HEAD -- . | grep -v '.gitlab-ci.yml')" ] ; then
        echo "Changes detected in Dockerfile or code. Building Docker image..."

        # Create a temporary directory for a clean build context
        BUILD_CONTEXT_DIR=$(mktemp -d)
        echo "Created temporary build context at: $BUILD_CONTEXT_DIR"

        # Copy the necessary files from the main project directory into the temporary build context
        # The 'nginx-front' folder and 'nginx.conf' now exist because of the 'before_script' section
        cp "$CI_PROJECT_DIR/deployment/dev/Dockerfile" "$BUILD_CONTEXT_DIR/"
        cp -r "$CI_PROJECT_DIR/nginx-front" "$BUILD_CONTEXT_DIR/"
        cp "$CI_PROJECT_DIR/nginx.conf" "$BUILD_CONTEXT_DIR/"

        # Navigate to the temporary directory to perform the build
        cd "$BUILD_CONTEXT_DIR"
        ls -l -a # Verify all files are in the context

        # Extract and increment the version tag
        previous_version=$(aws ecr describe-images --repository-name prmnxt_dev_msales --query "imageDetails[*].[imageTags[0], imagePushedAt]" --output text | sort -k2,2r | head -n1 | awk '{print $1}' || echo "v0")
        echo "Previous version -> $previous_version"

        numeric_version=$(echo "$previous_version" | grep -o -E '[0-9]+' | head -n1 || echo "0")
        prefix="v"
        new_image_tag_version=$((numeric_version + 1))
        new_version="${prefix}$new_image_tag_version"
        echo "New version -> $new_version"

        export IMAGE_TAG="prmnxt_dev_msales-$new_version-$CI_COMMIT_SHORT_SHA-$CI_PIPELINE_ID"

        # Docker image build from the clean context
        docker build -t prmnxt_dev_msales-$new_version -f Dockerfile .

        # Tag and push the new image
        docker tag prmnxt_dev_msales-$new_version 891377194963.dkr.ecr.ap-south-1.amazonaws.com/prmnxt_dev_msales:$IMAGE_TAG
        docker push 891377194963.dkr.ecr.ap-south-1.amazonaws.com/prmnxt_dev_msales:$IMAGE_TAG

        # Navigate back to the main project directory to save artifacts
        cd "$CI_PROJECT_DIR"

        # Save the IMAGE_TAG for artifacts
        echo "$IMAGE_TAG" > ecr_image_tag.txt
        echo "Current Build Image is ---> 891377194963.dkr.ecr.ap-south-1.amazonaws.com/prmnxt_dev_msales:$IMAGE_TAG"
      else
        echo "No relevant changes detected. Skipping Docker build."
        docker images
        PREVIOUS_IMAGE_TAG=$(aws ecr describe-images --repository-name prmnxt_dev_msales --query "imageDetails[*].[imageTags[0], imagePushedAt]" --output text | sort -k2,2r | head -n1 | awk '{print $1}' || echo "")

        if [ -z "$PREVIOUS_IMAGE_TAG" ]; then
          echo "No previous image found. Deployment will not proceed."
          echo "No previous image found" > ecr_image_tag.txt
          exit 1
        fi
        
        # Save the PREVIOUS_IMAGE_TAG to a file for artifacts
        echo "$PREVIOUS_IMAGE_TAG" > ecr_image_tag.txt
        echo "No new image build, using previous image for deployment ---> 891377194963.dkr.ecr.ap-south-1.amazonaws.com/prmnxt_dev_msales:$PREVIOUS_IMAGE_TAG"
      fi

  artifacts:
    paths:
      - ecr_image_tag.txt
  
  rules:
        # not run on merge request
       - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   
         changes: 
           - "**/*"
         when: never
        # run only on develop branch
       - if: '$CI_COMMIT_BRANCH != "develop"'
         when: never   
        # run through web interface for develop branch
       - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop"'
        #  run on develop branch on code changes detected
       - if: '$CI_COMMIT_BRANCH == "develop"'
       - changes:  
           - $CI_PROJECT_DIR/deployment/dev/Dockerfile
           - '**/*' 
       - when: never

