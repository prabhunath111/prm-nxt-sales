uat_prm_nxt_sales-docker_build:
  stage: docker
  tags:
    - prm-nxt-sales-service-uat-runner

  before_script:
    - mkdir -p msales-mumbai-frontend
    - cp -r build/* msales-mumbai-frontend/
    - cp deployment/uat/nginx.conf .
    - aws ecr get-login-password | docker login --username AWS --password-stdin $PRM_NXT_SALES_ECR_REGISTRY

  script:
    - |
      set -euo pipefail

      echo "Checking system resources..."
      free -h
      df -h /
      docker system df
      docker ps -a
      docker images

      echo "Preparing Docker build context..."
      ls -lh
      ls -lh msales-mumbai-frontend || echo " msales-mumbai-frontend missing!"

      echo "Fetching previous image version from ECR..."

      # Safe ECR fetch (won’t fail if no images exist)
      set +e
      previous_version=$(aws ecr describe-images \
        --repository-name uat-msales-mumbai-frontend \
        --query "imageDetails[*].[imageTags[0], imagePushedAt]" \
        --output text 2>/dev/null | sort -k2,2r | head -n1 | awk '{print $1}')
      set -e

      previous_version=${previous_version:-v0}
      echo "Previous version -> $previous_version"

      numeric_version=$(echo "$previous_version" | sed 's/[^0-9]*//g')
      numeric_version=${numeric_version:-0}
      echo "Extracted numeric version -> $numeric_version"

      new_version="v$((numeric_version + 1))"
      echo "New version -> $new_version"

      IMAGE_TAG="uat-msales-mumbai-frontend-${new_version}-${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}"
      echo "Generated image tag -> $IMAGE_TAG"

      echo "==> Starting Docker build..."
      docker build \
        -t uat-msales-mumbai-frontend-${new_version} \
        -f deployment/uat/Dockerfile .

      echo "==> Tagging image..."
      docker tag \
        uat-msales-mumbai-frontend-${new_version} \
        891377194963.dkr.ecr.ap-south-1.amazonaws.com/uat-msales-mumbai-frontend:${IMAGE_TAG}

      echo "==> Pushing image to ECR..."
      docker push \
        891377194963.dkr.ecr.ap-south-1.amazonaws.com/uat-msales-mumbai-frontend:${IMAGE_TAG}

      echo "${IMAGE_TAG}" > ecr_image_tag.txt
      echo " Image pushed successfully:"
      echo "891377194963.dkr.ecr.ap-south-1.amazonaws.com/uat-msales-mumbai-frontend:${IMAGE_TAG}"

  artifacts:
    paths:
      - ecr_image_tag.txt

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never

    - if: '$CI_COMMIT_BRANCH == "uat"'
      changes:
        - deployment/uat/Dockerfile
        - "**/*"

