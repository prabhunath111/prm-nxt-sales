        - sleep 140
        - kubectl get po -n prod
        - kubectl get deployment -n prod
        - POD_ID=$(kubectl get po -n prod  -l app=prod-msales-mumbai-frontend --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}')
        - kubectl get deployment -n prod
        # Check the pod status
        - POD_STATUS=$(kubectl get po $POD_ID -n prod -o jsonpath='{.status.phase}')
        - echo "Pod status is --> $POD_STATUS"
        # Check the container readiness status
        - CONTAINER_STATUS=$(kubectl get po $POD_ID -n prod -o jsonpath='{.status.containerStatuses[*].ready}')
        - echo "Container readiness status is --> $CONTAINER_STATUS"
        # Fail the stage if the pod is not running
        - |
            if [[ "$POD_STATUS" != "Running" || $(echo "$CONTAINER_STATUS" | grep -v "true") ]]; then 
                echo "Deployment failed:Pod is not running or not ready. Status:$POD_STATUS, Readiness:$CONTAINER_STATUS"; 
            exit 1; 
            fi
        - kubectl describe po $POD_ID -n prod
        - kubectl get deployment prod-msales-mumbai-frontend -n prod -o jsonpath='{.spec.template.spec.containers[0].image}'
        - kubectl get po $POD_ID -n prod
    rules:
        # not run on merge request
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   
          changes: 
            - "**/*"
          when: never
        # run only on prod branch
        - if: '$CI_COMMIT_BRANCH != "main"'
          when: never   
        # run through web interface for prod branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"'
          when: manual
        #  run on prod branch on code changes detected
        - if: '$CI_COMMIT_BRANCH == "main"'
        - changes:  
            - $CI_PROJECT_DIR/deployment/prod/Dockerfile
            - '**/*'
        - when: never

prod_prm_nxt_sales-restart_deployment:
    stage: restart-deployment
    when: manual
    tags:
        - prm-nxt-sales-service-prod-runner
    before_script:
        - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $PRM_NXT_SALES_PROD_ECR_REGISTRY
        - aws eks --region $AWS_DEFAULT_REGION update-kubeconfig --name $AWS_EKS_PROD_CLUSTER_NAME
    script:
        - echo "Restarting Service Deployment"
        - kubectl rollout restart deployment/prod-msales-mumbai-frontend -n prod
        - echo "Waiting for the pods to be ready..."
        # Initial sleep before checking the status
        - sleep 60  
        - MAX_RETRIES=10 
        - RETRIES=0
        - SUCCESS=false
        - >
          while [ $RETRIES -lt $MAX_RETRIES ]; do
            status=$(kubectl rollout status deployment/prod-msales-mumbai-frontend -n prod)
            echo $status
            if [[ $status == *"successfully rolled out"* ]]; then
              SUCCESS=true
              break
            elif [[ $status == *"waiting for deployment"* || $status == *"pending termination"* ]]; then
              echo "Still waiting for rollout... retrying in 30s"
            fi
            RETRIES=$((RETRIES+1))
            # Added sleep before checking the status again
            sleep 30  
          done
          # Added condition to check if rollout was successful and fail the job if not
        - >
          if [ "$SUCCESS" = true ]; then
            echo "Deployment successfully rolled out."
          else
            echo "Failed to recreate deployment after $MAX_RETRIES attempts. Exiting..."
            exit 1  # Fail the job
          fi

        - POD_ID=$(kubectl get po -n prod -l app=prod-msales-mumbai-frontend --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}')
        - kubectl get po $POD_ID -n prod
        # Check the pod status
        - POD_STATUS=$(kubectl get po $POD_ID -n prod -o jsonpath='{.status.phase}')
        - echo "Pod status is --> $POD_STATUS"
        # Check the container readiness status
        - CONTAINER_STATUS=$(kubectl get po $POD_ID -n prod -o jsonpath='{.status.containerStatuses[*].ready}')
        - echo "Container readiness status is --> $CONTAINER_STATUS"
        # Fail the stage if the pod is not running
        - |
            if [[ "$POD_STATUS" != "Running" || $(echo "$CONTAINER_STATUS" | grep -v "true") ]]; then 
                echo "Deployment failed:Pod is not running or not ready. Status:$POD_STATUS, Readiness:$CONTAINER_STATUS"; 
            exit 1; 
            fi
        - kubectl describe po $POD_ID -n prod
        - kubectl get deployment prod-msales-mumbai-frontend -n prod -o jsonpath='{.spec.template.spec.containers[0].image}'
        - kubectl get po $POD_ID -n prod
        - echo "Deployment got restarted with pod ---> $POD_ID"
    rules:
        # not run on merge request
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   
          changes: 
            - "**/*"
          when: never
        # run only on prod branch
        - if: '$CI_COMMIT_BRANCH != "main"'
          when: never   
        # run through web interface for prod branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"'
          when: manual
        #  run on prod branch on code changes detected
        - if: '$CI_COMMIT_BRANCH == "main"'
        - changes:  
            - $CI_PROJECT_DIR/deployment/prod/Dockerfile
            - '**/*'
        - when: never
