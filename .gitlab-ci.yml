uat_prm_nxt_sales-deploy:
    stage: deploy 
    # when: manual
    tags:
        - prm-nxt-sales-service-uat-runner
    before_script:
        - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $PRM_NXT_SALES_ECR_REGISTRY
        - aws eks --region $AWS_DEFAULT_REGION update-kubeconfig --name $AWS_EKS_UAT_CLUSTER_NAME
    script:
        #Get nodes
        - kubectl get nodes
        - kubectl get po -n uat
        #Fetch Image tag in variable
        - IMAGE_TAG=$(cat ecr_image_tag.txt)
        - echo "Deploying with image 891377194963.dkr.ecr.ap-south-1.amazonaws.com/uat-msales-mumbai-frontend:$IMAGE_TAG"
        #Change Image tag in YAML
        - sed "s/{{IMAGE_TAG}}/${IMAGE_TAG}/g" $CI_PROJECT_DIR/deployment/uat/nginx-frontend-deployment.yaml > nginx_updated-frontend-deployment.yaml
        - kubectl apply -f nginx_updated-frontend-deployment.yaml -n uat
        - sleep 70
        - POD_ID=$(kubectl get po -n uat  -l app=uat-msales-mumbai-frontend --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}')
        - kubectl get deployment -n uat
        # Check the pod status
        - POD_STATUS=$(kubectl get po $POD_ID -n uat -o jsonpath='{.status.phase}')
        - echo "Pod status is --> $POD_STATUS"
        # Check the container readiness status
        - CONTAINER_STATUS=$(kubectl get po $POD_ID -n uat -o jsonpath='{.status.containerStatuses[*].ready}')
        - echo "Container readiness status is --> $CONTAINER_STATUS"
        # Fail the stage if the pod is not running
        - |
            if [[ "$POD_STATUS" != "Running" || $(echo "$CONTAINER_STATUS" | grep -v "true") ]]; then 
                echo "Deployment failed:Pod is not running or not ready. Status:$POD_STATUS, Readiness:$CONTAINER_STATUS"; 
            exit 1; 
            fi
        - kubectl describe po $POD_ID -n uat
        - kubectl get deployment uat-msales-mumbai-frontend -n uat -o jsonpath='{.spec.template.spec.containers[0].image}'
        - kubectl get po $POD_ID -n uat
    artifacts:
        paths:
            - ecr_image_tag.txt
    rules:
        # not run on merge request
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   
          changes: 
            - "**/*"
          when: never
        # run only on uat branch
        - if: '$CI_COMMIT_BRANCH != "uat"'
          when: never   
        # run through web interface for uat branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "uat"'
          when: always
        #  run on uat branch on code changes detected
        - if: '$CI_COMMIT_BRANCH == "uat"'
        - changes:  
            - $CI_PROJECT_DIR/deployment/uat/Dockerfile
            - '**/*'
        - when: never

uat_prm_nxt_sales-rollback:
    stage: rollback 
    when: manual
    tags:
        - prm-nxt-sales-service-uat-runner
    before_script:
        - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $PRM_NXT_SALES_ECR_REGISTRY
        - aws eks --region $AWS_DEFAULT_REGION update-kubeconfig --name $AWS_EKS_UAT_CLUSTER_NAME
    script:
        - if [ -n "$PRM_NXT_SALES_UAT_ROLLBACK_SPECIFIC_VERSION_IMG_TAG" ]; then
            echo "Rolling back to specific image version deployment ---> 891377194963.dkr.ecr.ap-south-1.amazonaws.com/uat-msales-mumbai-frontend:$PRM_NXT_SALES_UAT_ROLLBACK_SPECIFIC_VERSION_IMG_TAG";
            kubectl set image deployment/uat-msales-mumbai-frontend uat-msales-mumbai-frontend=891377194963.dkr.ecr.ap-south-1.amazonaws.com/uat-msales-mumbai-frontend:$PRM_NXT_SALES_UAT_ROLLBACK_SPECIFIC_VERSION_IMG_TAG -n uat || exit 1;
          else
            echo "No specific image version is specified for rollback, So Rolling back to the previous revision";
            previous_version=$(aws ecr describe-images --repository-name uat-msales-mumbai-frontend --query "imageDetails[?imageTags[?contains(@, 'uat-msales-mumbai-frontend')]].[imageTags[0], imagePushedAt]" --output text --region ap-south-1 | sort -k2,2r | awk 'NR==2 {print $1}');
            echo "Previous ECR image ---> 891377194963.dkr.ecr.ap-south-1.amazonaws.com/uat-msales-mumbai-frontend:$previous_version";

            if kubectl get deployment uat-msales-mumbai-frontend -n uat; then
                kubectl delete deployment uat-msales-mumbai-frontend -n uat || exit 1;
                kubectl create deployment uat-msales-mumbai-frontend --image=891377194963.dkr.ecr.ap-south-1.amazonaws.com/uat-msales-mumbai-frontend:$previous_version -n uat || exit 1;
            else
                echo "Deployment uat-msales-mumbai-frontend does not exist. Unable to rollback.";
                exit 1;
            fi  
          fi
        - sleep 140
        - kubectl get po -n uat
        - kubectl get deployment -n uat
        - POD_ID=$(kubectl get po -n uat  -l app=uat-msales-mumbai-frontend --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}')
        - kubectl get deployment -n uat
        # Check the pod status
        - POD_STATUS=$(kubectl get po $POD_ID -n uat -o jsonpath='{.status.phase}')
        - echo "Pod status is --> $POD_STATUS"
        # Check the container readiness status
        - CONTAINER_STATUS=$(kubectl get po $POD_ID -n uat -o jsonpath='{.status.containerStatuses[*].ready}')
        - echo "Container readiness status is --> $CONTAINER_STATUS"
        # Fail the stage if the pod is not running
        - |
            if [[ "$POD_STATUS" != "Running" || $(echo "$CONTAINER_STATUS" | grep -v "true") ]]; then 
                echo "Deployment failed:Pod is not running or not ready. Status:$POD_STATUS, Readiness:$CONTAINER_STATUS"; 
            exit 1; 
            fi
        - kubectl describe po $POD_ID -n uat
        - kubectl get deployment uat-msales-mumbai-frontend -n uat -o jsonpath='{.spec.template.spec.containers[0].image}'
        - kubectl get po $POD_ID -n uat
    rules:
        # not run on merge request
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   
          changes: 
            - "**/*"
          when: never
        # run only on uat branch
        - if: '$CI_COMMIT_BRANCH != "uat"'
          when: never   
        # run through web interface for uat branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "uat"'
          when: manual
        #  run on uat branch on code changes detected
        - if: '$CI_COMMIT_BRANCH == "uat"'
        - changes:  
            - $CI_PROJECT_DIR/deployment/uat/Dockerfile
            - '**/*'
        - when: never

uat_prm_nxt_sales-restart_deployment:
    stage: restart-deployment
    when: manual
    tags:
        - prm-nxt-sales-service-uat-runner
    before_script:
        - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $PRM_NXT_SALES_ECR_REGISTRY
        - aws eks --region $AWS_DEFAULT_REGION update-kubeconfig --name $AWS_EKS_UAT_CLUSTER_NAME
    script:
        - echo "Restarting Service Deployment"
        - kubectl rollout restart deployment/uat-msales-mumbai-frontend -n uat
        - echo "Waiting for the pods to be ready..."
        # Initial sleep before checking the status
        - sleep 60  
        - MAX_RETRIES=10 
        - RETRIES=0
        - SUCCESS=false
        - >
          while [ $RETRIES -lt $MAX_RETRIES ]; do
            status=$(kubectl rollout status deployment/uat-msales-mumbai-frontend -n uat)
            echo $status
            if [[ $status == *"successfully rolled out"* ]]; then
              SUCCESS=true
              break
            elif [[ $status == *"waiting for deployment"* || $status == *"pending termination"* ]]; then
              echo "Still waiting for rollout... retrying in 30s"
            fi
            RETRIES=$((RETRIES+1))
            # Added sleep before checking the status again
            sleep 30  
          done
          # Added condition to check if rollout was successful and fail the job if not
        - >
          if [ "$SUCCESS" = true ]; then
            echo "Deployment successfully rolled out."
          else
            echo "Failed to recreate deployment after $MAX_RETRIES attempts. Exiting..."
            exit 1  # Fail the job
          fi

        - POD_ID=$(kubectl get po -n uat -l app=uat-msales-mumbai-frontend --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1:].metadata.name}')
        - kubectl get po $POD_ID -n uat
        # Check the pod status
        - POD_STATUS=$(kubectl get po $POD_ID -n uat -o jsonpath='{.status.phase}')
        - echo "Pod status is --> $POD_STATUS"
        # Check the container readiness status
        - CONTAINER_STATUS=$(kubectl get po $POD_ID -n uat -o jsonpath='{.status.containerStatuses[*].ready}')
        - echo "Container readiness status is --> $CONTAINER_STATUS"
        # Fail the stage if the pod is not running
        - |
            if [[ "$POD_STATUS" != "Running" || $(echo "$CONTAINER_STATUS" | grep -v "true") ]]; then 
                echo "Deployment failed:Pod is not running or not ready. Status:$POD_STATUS, Readiness:$CONTAINER_STATUS"; 
            exit 1; 
            fi
        - kubectl describe po $POD_ID -n uat
        - kubectl get deployment uat-msales-mumbai-frontend -n uat -o jsonpath='{.spec.template.spec.containers[0].image}'
        - kubectl get po $POD_ID -n uat
        - echo "Deployment got restarted with pod ---> $POD_ID"
    rules:
        # not run on merge request
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   
          changes: 
            - "**/*"
          when: never
        # run only on uat branch
        - if: '$CI_COMMIT_BRANCH != "uat"'
          when: never   
        # run through web interface for uat branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "uat"'
          when: manual
        #  run on uat branch on code changes detected
        - if: '$CI_COMMIT_BRANCH == "uat"'
        - changes:  
            - $CI_PROJECT_DIR/deployment/uat/Dockerfile
            - '**/*'
        - when: never

