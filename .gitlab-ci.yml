prod_prm_nxt_sales-docker_build:
    stage: docker 
    tags:
        - prm-nxt-sales-service-prod-runner
    before_script:
        # in dockerfile build folder used as prod-msales-mumbai-frontend 
        - mkdir -p prod-msales-mumbai-frontend 
        # copying build folder content in prod-msales-mumbai-frontend folder
        - cp -r build/* prod-msales-mumbai-frontend/
        - ls prod-msales-mumbai-frontend/
        # copying nginx.config file in root to apply nginx rule using docker file
        - cp deployment/prod/nginx.conf .
        - aws ecr get-login-password | docker login --username AWS --password-stdin $PRM_NXT_SALES_PROD_ECR_REGISTRY
    script:
        - echo "Checking for changes in Dockerfile and source files..."
        # if files are modified except CI file then only build new docker image apply new tag , and push to ecr
        - |
            if [ -n "$(git diff --name-only HEAD~1 HEAD -- $CI_PROJECT_DIR/deployment/prod/Dockerfile)" ] || [ -n "$(git diff --name-only HEAD~1 HEAD -- . | grep -v '.gitlab-ci.yml')" ] ; then
                echo "Changes detected in  Dockerfile or code. Building Docker image..."
                docker images
                # extracting previous version tag 
                previous_version=$(aws ecr describe-images --repository-name prod-msales-mumbai-frontend --query "imageDetails[*].[imageTags[0], imagePushedAt]" --output text| sort -k2,2r | head -n1 | awk '{print $1}')
                echo "Previous version -> $previous_version"
                # Extract the numeric part from the version tag
                numeric_version=$(echo "$previous_version" | grep -o -E '[0-9]+' | head -n1)
                echo "Extracted numeric version -> $numeric_version"
                # Set the prefix to always be lowercase 'v'
                prefix="v"
                new_image_tag_version=$((numeric_version + 1))
                echo "Incremented version -> $new_image_tag_version"
                # Concatenate the 'v' with the incremented version number
                new_version="${prefix}$new_image_tag_version"
                echo "New version -> $new_version"
                export IMAGE_TAG="prod-msales-mumbai-frontend-$new_version-$CI_COMMIT_SHORT_SHA-$CI_PIPELINE_ID"
                # docker image build
                docker build -t prod-msales-mumbai-frontend-$new_version -f $CI_PROJECT_DIR/deployment/prod/Dockerfile .
                docker images
                # apply new image tag
                docker tag prod-msales-mumbai-frontend-$new_version 588738605243.dkr.ecr.ap-south-1.amazonaws.com/prod-msales-mumbai-frontend:$IMAGE_TAG
                docker images
                # push new docker image
                docker push 588738605243.dkr.ecr.ap-south-1.amazonaws.com/prod-msales-mumbai-frontend:$IMAGE_TAG
                # Save the IMAGE_TAG to a file for reference 
                echo $IMAGE_TAG > ecr_image_tag.txt
                echo "Current Build Image is ---> 588738605243.dkr.ecr.ap-south-1.amazonaws.com/prod-msales-mumbai-frontend:$IMAGE_TAG"
            else
                echo "No relevant changes detected. Skipping Docker build."
                docker images
                PREVIOUS_IMAGE_TAG=$(aws ecr describe-images --repository-name prod-msales-mumbai-frontend --query "imageDetails[*].[imageTags[0], imagePushedAt]" --output text | sort -k2,2r | head -n1 | awk '{print $1}')
                # Save the IMAGE_TAG to a file for reference
                echo $PREVIOUS_IMAGE_TAG > ecr_image_tag.txt
                echo "No new image build, Using previous image for deployment ---> 588738605243.dkr.ecr.ap-south-1.amazonaws.com/prod-msales-mumbai-frontend:$PREVIOUS_IMAGE_TAG"
            fi
    artifacts:
        paths:
            - ecr_image_tag.txt
    rules:
        # not run on merge request
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'   
          changes: 
            - "**/*"
          when: never
        # run only on prod branch
        - if: '$CI_COMMIT_BRANCH != "main"'
          when: never   
        # run through web interface for prod branch
        - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"'
        #  run on prod branch on code changes detected
        - if: '$CI_COMMIT_BRANCH == "main"'
        - changes:  
            - $CI_PROJECT_DIR/deployment/prod/Dockerfile
            - '**/*' 


