    before_script:
        - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $PRM_NXT_SALES_PROD_ECR_REGISTRY
        - aws eks --region $AWS_DEFAULT_REGION update-kubeconfig --name $AWS_EKS_PROD_CLUSTER_NAME
    script:
        - if [ -n "$PRM_NXT_SALES_PROD_ROLLBACK_SPECIFIC_VERSION_IMG_TAG" ]; then
            echo "Rolling back to specific image version deployment ---> 588738605243.dkr.ecr.ap-south-1.amazonaws.com/prod-msales-mumbai-frontend:$PRM_NXT_SALES_PROD_ROLLBACK_SPECIFIC_VERSION_IMG_TAG";
            kubectl set image deployment/prod-msales-mumbai-frontend prod-msales-mumbai-frontend=588738605243.dkr.ecr.ap-south-1.amazonaws.com/prod-msales-mumbai-frontend:$PRM_NXT_SALES_PROD_ROLLBACK_SPECIFIC_VERSION_IMG_TAG -n prod || exit 1;
          else
            echo "No specific image version is specified for rollback, So Rolling back to the previous revision";
            previous_version=$(aws ecr describe-images --repository-name prod-msales-mumbai-frontend --query "imageDetails[?imageTags[?contains(@, 'prod-msales-mumbai-frontend')]].[imageTags[0], imagePushedAt]" --output text --region ap-south-1 | sort -k2,2r | awk 'NR==2 {print $1}');
            echo "Previous ECR image ---> 588738605243.dkr.ecr.ap-south-1.amazonaws.com/prod-msales-mumbai-frontend:$previous_version";

            if kubectl get deployment prod-msales-mumbai-frontend -n prod; then
