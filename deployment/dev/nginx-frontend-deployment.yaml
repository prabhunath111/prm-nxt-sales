apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-frontend
  namespace: dev
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: nginx-frontend
  template:
    metadata:
      labels:
        app: nginx-frontend
    spec:
      containers:
      - name: nginx-frontend
        image: "891377194963.dkr.ecr.ap-south-1.amazonaws.com/prmnxt_dev_msales:{{IMAGE_TAG}}"
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: msales-secret
        securityContext:
          runAsUser: 100
          runAsNonRoot: true
          allowPrivilegeEscalation: false
      nodeSelector:
        eks.amazonaws.com/nodegroup: prmnxt-dev-msales-node-AL-1