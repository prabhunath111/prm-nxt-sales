apiVersion: apps/v1
kind: Deployment
metadata:
  name: pre-prod-msales-mumbai-frontend
  namespace: preprod
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: pre-prod-msales-mumbai-frontend
  template:
    metadata:
      labels:
        app: pre-prod-msales-mumbai-frontend
    spec:
      containers:
      - name: pre-prod-msales-mumbai-frontend
        image: 588738605243.dkr.ecr.ap-south-1.amazonaws.com/pre-prod-msales-mumbai-frontend:{{IMAGE_TAG}}
        ports:
        - containerPort: 3000
        securityContext:
          runAsUser: 100  
          runAsNonRoot: true
          allowPrivilegeEscalation: false
      nodeSelector:
        eks.amazonaws.com/nodegroup: pre-prod-msales-mum-node-1

